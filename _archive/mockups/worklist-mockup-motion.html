<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Work List — Obys mid-line lock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff;
    --fg:#4a4a48;
    --accent:#B84545;
    --muted:rgba(74,74,72,0.4);
    --muted-strong:rgba(74,74,72,0.78);
    --card-w: 300px; /* +15% from 260 */
    --card-h: 184px; /* +15% from 160 */
    --card-gap: 52px;
  }
  *{ box-sizing:border-box; margin:0; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Space Grotesk', system-ui, sans-serif;
  }

  .intro{
    max-width:880px;
    margin:0 auto;
    padding:2.5rem 1.5rem 0.5rem;
  }
  .intro h1{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:1.85rem;
    margin-bottom:0.35rem;
  }
  .intro p{
    color:var(--muted-strong);
    font-size:0.86rem;
    line-height:1.55;
    max-width:560px;
  }
  .hint{
    text-align:center;
    font-size:0.7rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    padding:1rem 0 1.5rem;
  }

  .work-pin-wrap{
    position:relative;
    height:600vh;
  }

  .work-stage{
    position:sticky;
    top:0;
    height:100vh;
    height:100dvh;
    width:100%;
    overflow:hidden;
    display:grid;
    /*
      Wide side gutters so:
      - left titles stay near the LEFT
      - image stays dead CENTER
      - right meta sits near the RIGHT (mirror of left)
    */
    grid-template-columns: minmax(12rem, 1fr) var(--card-w) minmax(12rem, 1fr);
    column-gap:clamp(2rem, 5vw, 4.5rem);
    max-width:1500px;
    margin:0 auto;
    padding:0 clamp(2.5rem, 6vw, 5rem);
  }

  /* ── LEFT: titles hug the left side of the left column ── */
  .wp-list-wrap{
    position:relative;
    height:100%;
    justify-self:start; /* 靠左，像 06 Marilyn 那样 */
    display:flex;
    align-items:center;
    max-width:22rem;
    width:100%;
    padding-left:0.25rem;
  }
  .wp-list{
    display:flex;
    flex-direction:column;
    gap:0.4rem;
    text-align:left;
    will-change: transform;
  }
  .wp-name{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:300;
    font-size:1.35rem;
    line-height:1.45;
    color:var(--muted);
    opacity:0.38;
    transition: color 0.3s ease, font-size 0.3s ease, opacity 0.3s ease;
  }
  .wp-name .num{
    font-size:0.85em;
    margin-right:0.5rem;
  }
  .wp-name.is-focus{
    font-size:clamp(1.95rem, 3.1vw, 2.55rem);
    color:var(--fg);
    opacity:1;
  }
  .wp-name.is-focus .num{ color:var(--accent); }

  /* ── CENTER: image rail ── */
  .wp-rail{
    position:relative;
    width:var(--card-w);
    height:100%;
    justify-self:center;
  }
  .wp-card{
    position:absolute;
    left:0;
    width:var(--card-w);
    height:var(--card-h);
    transform-origin:50% 50%;
    will-change: top, opacity, transform;
  }
  .wp-card .inner{
    width:100%;
    height:100%;
    border-radius:2px;
    overflow:hidden;
    background:#ececec;
    box-shadow:0 14px 40px rgba(0,0,0,0.1);
  }
  .wp-card img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .wp-card.is-focus{
    z-index:5;
    opacity:1 !important;
    transform:scale(1) !important;
  }
  .wp-card.is-focus .inner{
    box-shadow:0 24px 60px rgba(0,0,0,0.16);
  }

  /* ── RIGHT: 往右靠（镜像左边），type + 箭头并排，整块垂直中线 ── */
  .wp-right-wrap{
    position:relative;
    height:100%;
    justify-self:end; /* 靠右 */
    display:flex;
    align-items:center;
    justify-content:flex-end;
    width:100%;
    max-width:18rem;
    padding-right:0.25rem;
  }
  .wp-right{
    display:flex;
    flex-direction:row;
    align-items:center;
    justify-content:flex-end;
    gap:1rem;
  }
  .wp-type{
    font-size:0.95rem; /* 说明字放大 */
    letter-spacing:0.12em;
    line-height:1.55;
    color:var(--muted-strong);
    text-align:right;
  }
  .wp-arrow{
    flex-shrink:0;
    color:var(--accent);
    font-size:1.55rem; /* 箭头略放大 */
    line-height:1;
  }

  footer{
    max-width:640px;
    margin:0 auto;
    padding:2.5rem 1.5rem 4rem;
    font-size:0.82rem;
    color:var(--muted-strong);
    line-height:1.55;
  }

  /* ── Mobile classic list (old layout) — desktop hidden ── */
  .work-list-mobile{
    display:none;
    list-style:none;
    margin:0 auto;
    padding:0 1.25rem 3rem;
    max-width:640px;
  }
  .work-list-mobile .work-item{
    border-bottom:1px solid rgba(74,74,72,0.14);
  }
  /* Old list: number + title + type only — NO thumbnail */
  .work-list-mobile .work-inner{
    display:grid;
    grid-template-columns: 2.5rem 1fr auto;
    gap:0.35rem 1rem;
    padding:1.75rem 0;
    align-items:center;
  }
  .work-list-mobile .wi-num{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1rem;
    color:var(--muted-strong);
    align-self:start;
    padding-top:0.35rem;
  }
  .work-list-mobile .wi-text{
    min-width:0;
  }
  .work-list-mobile .wi-name{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:300;
    font-size:clamp(1.75rem, 7vw, 2.4rem);
    line-height:1.1;
    color:var(--fg);
    letter-spacing:-0.02em;
    display:block;
  }
  .work-list-mobile .wi-type{
    display:block;
    margin-top:0.45rem;
    font-size:0.78rem;
    letter-spacing:0.06em;
    line-height:1.45;
    color:var(--muted-strong);
  }
  .work-list-mobile .wi-arrow{
    color:var(--accent);
    font-size:1.25rem;
    flex-shrink:0;
    align-self:center;
  }
  .work-list-mobile .wi-thumb{ display:none !important; }

  /* Desktop only: pin scroll. Mobile: classic list. */
  @media (max-width:900px){
    .hint{ display:none; }
    .work-pin-wrap{ display:none !important; }
    .work-list-mobile{ display:block; }
  }
  @media (min-width:901px){
    .work-list-mobile{ display:none !important; }
  }
</style>
</head>
<body>

  <div class="intro">
    <h1>Work list — desktop Obys / mobile classic</h1>
    <p>
      <strong>桌面：</strong>Obys 式 pin + 中线 focus。<br>
      <strong>行动版：</strong>旧版静态列表（编号 · 标题 · 缩图 · 类型 · 箭头），无 pin 滚动。
    </p>
  </div>
  <p class="hint">↓ desktop：scroll through projects ↓</p>

  <!-- Desktop only -->
  <section class="work-pin-wrap" id="workPin">
    <div class="work-stage" id="workStage">
      <div class="wp-list-wrap">
        <div class="wp-list" id="wpList"></div>
      </div>
      <div class="wp-rail" id="wpRail"></div>
      <div class="wp-right-wrap">
        <div class="wp-right">
          <div class="wp-type" id="wpType"></div>
          <span class="wp-arrow">→</span>
        </div>
      </div>
    </div>
  </section>

  <!-- Mobile only: classic list (old layout) -->
  <ul class="work-list-mobile" id="workListMobile" aria-label="Selected work"></ul>

  <footer>
    Desktop ≥901px: pin scroll. Mobile ≤900px: classic list. Hard refresh: Cmd+Shift+R.
  </footer>

<script>
(function () {
  const CARD_H = 184; // match --card-h (+15%)
  const CARD_GAP = 52;
  const STEP = CARD_H + CARD_GAP;

  const projects = [
    {
      name: 'FainTV',
      type: 'Cross-screen · Mobile<br>Tablet · Web · TV',
      img: 'https://images.squarespace-cdn.com/content/v1/69454dff3cd6134ff5e7f86a/6aec79a7-2e69-4843-899e-4c15bd551b17/1.1+loading+page.jpg'
    },
    {
      name: 'Visual Cues Study',
      type: 'UX Research<br>Mixed Methods',
      img: 'images/vcue/vcue-banner.jpg'
    },
    {
      name: 'Health GeneTech',
      type: 'Responsive Web<br>Branding',
      img: 'https://images.squarespace-cdn.com/content/v1/69454dff3cd6134ff5e7f86a/26e8690c-4bb6-4fe0-9ffe-77550d479b06/2.1+loading+page.jpg'
    },
    {
      name: 'Training for Life',
      type: 'Mobile · Wearable',
      img: 'https://images.squarespace-cdn.com/content/v1/69454dff3cd6134ff5e7f86a/b37447d1-fc78-41b5-812e-6c7127c5a7bf/4.1+-+workout+landing+page.jpg'
    },
    {
      name: 'Ai Cun Cell',
      type: 'Mobile · Healthcare',
      img: 'https://images.squarespace-cdn.com/content/v1/69454dff3cd6134ff5e7f86a/a2c6df5c-28b9-480b-a51f-171dc085410b/1.1+landing+page.jpg'
    },
    {
      name: 'Marilyn',
      type: 'Responsive Web<br>Campaign',
      img: 'https://images.squarespace-cdn.com/content/v1/69454dff3cd6134ff5e7f86a/a7f85fc8-9e9d-48cc-8b65-d1ea109acdd0/banner.png'
    }
  ];

  const n = projects.length;
  const wrap = document.getElementById('workPin');
  const stage = document.getElementById('workStage');
  const list = document.getElementById('wpList');
  const rail = document.getElementById('wpRail');
  const typeEl = document.getElementById('wpType');
  const mobileList = document.getElementById('workListMobile');

  const cards = [];
  const names = [];
  const isMobile = () => window.matchMedia('(max-width: 900px)').matches;

  // Desktop DOM
  projects.forEach((p, i) => {
    const nameEl = document.createElement('div');
    nameEl.className = 'wp-name';
    nameEl.innerHTML =
      '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' + p.name;
    list.appendChild(nameEl);
    names.push(nameEl);

    const card = document.createElement('div');
    card.className = 'wp-card';
    card.innerHTML =
      '<div class="inner"><img src="' + p.img + '" alt="' + p.name + '" draggable="false"></div>';
    rail.appendChild(card);
    cards.push(card);
  });

  // Mobile classic list (old layout: title + type only, no thumb)
  projects.forEach((p, i) => {
    const li = document.createElement('li');
    li.className = 'work-item';
    const typeOneLine = p.type.replace(/<br\s*\/?>/gi, ' · ');
    li.innerHTML =
      '<div class="work-inner">' +
        '<span class="wi-num">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<div class="wi-text">' +
          '<span class="wi-name">' + p.name + '</span>' +
          '<span class="wi-type">' + typeOneLine + '</span>' +
        '</div>' +
        '<span class="wi-arrow">→</span>' +
      '</div>';
    mobileList.appendChild(li);
  });

  function setRunway() {
    // No tall pin runway on mobile
    if (isMobile()) {
      wrap.style.height = 'auto';
      return;
    }
    wrap.style.height = n * 100 + 'vh';
  }

  function progress() {
    const r = wrap.getBoundingClientRect();
    const scrollable = r.height - window.innerHeight;
    if (scrollable <= 1) return 0;
    return Math.max(0, Math.min(1, -r.top / scrollable));
  }

  let lastIdx = -1;
  let raf = 0;

  function frame() {
    raf = 0;
    if (isMobile()) {
      list.style.transform = '';
      return; // mobile uses classic list only
    }

    const stageRect = stage.getBoundingClientRect();
    const railRect = rail.getBoundingClientRect();

    // Shared horizontal mid-line of the screen
    const midY = stageRect.top + stageRect.height * 0.5;

    const t = progress() * (n - 1);
    const idx = Math.max(0, Math.min(n - 1, Math.round(t)));

    // ── Images: focus card center = midY ──
    cards.forEach((card, i) => {
      const centerY = midY + (i - t) * STEP;
      card.style.top = (centerY - CARD_H * 0.5 - railRect.top) + 'px';

      const dist = Math.abs(i - t);
      const isFocus = i === idx;
      card.classList.toggle('is-focus', isFocus);

      if (isFocus) {
        card.style.opacity = '1';
        card.style.transform = 'scale(1)';
      } else {
        card.style.opacity = String(Math.max(0.1, 0.3 - Math.max(0, dist - 0.45) * 0.12));
        card.style.transform = 'scale(0.86)';
      }
    });

    // ── Names: keep list layout, shift whole list so focus name center = midY ──
    names.forEach((el, i) => {
      el.classList.toggle('is-focus', i === idx);
      el.style.opacity = i === idx
        ? '1'
        : String(Math.max(0.15, 0.42 - Math.abs(i - t) * 0.1));
    });

    // After class/size update, measure focus name and translate list
    // Use double rAF-free measure: font-size transition can lag; measure anyway
    const focusName = names[idx];
    const nameRect = focusName.getBoundingClientRect();
    const nameCenter = nameRect.top + nameRect.height * 0.5;

    // Current list transform (parse)
    const prev = list.style.transform;
    let prevY = 0;
    if (prev && prev.includes('translateY')) {
      const m = prev.match(/translateY\(([-\d.]+)px\)/);
      if (m) prevY = parseFloat(m[1]) || 0;
    }

    // nameCenter already includes prevY; we need midY - nameCenter added to prevY
    const delta = midY - nameCenter;
    const nextY = prevY + delta;
    list.style.transform = 'translateY(' + nextY + 'px)';

    if (idx !== lastIdx) {
      lastIdx = idx;
      typeEl.innerHTML = projects[idx].type;
    }
  }

  function onScroll() {
    if (!raf) raf = requestAnimationFrame(frame);
  }

  setRunway();
  typeEl.innerHTML = projects[0].type;
  names[0].classList.add('is-focus');
  cards[0].classList.add('is-focus');

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => {
    list.style.transform = 'translateY(0px)';
    setRunway();
    onScroll();
  }, { passive: true });

  rail.querySelectorAll('img').forEach((img) => {
    if (!img.complete) img.addEventListener('load', onScroll, { once: true });
  });

  // After fonts/layout settle, align once more
  requestAnimationFrame(() => {
    setRunway();
    frame();
    // second pass after focus font-size applies
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
