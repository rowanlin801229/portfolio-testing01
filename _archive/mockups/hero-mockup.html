<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; font-family: 'Cormorant Garamond', serif; }

  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero img.photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  /* 深色背景：簽名改用 invert + screen */
  .hero img.sig {
    position: relative;
    z-index: 2;
    width: clamp(260px, 48vw, 680px);
    height: auto;
    mix-blend-mode: screen;
    filter: invert(1);
  }

  .text-overlay {
    position: absolute;
    z-index: 3;
    pointer-events: none;
  }

  /* Scroll indicator — 白色，深色背景 */
  .scroll-ind {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.55rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }

  .scroll-bar {
    width: 1px;
    height: 48px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.5), transparent);
    animation: scrl 2.2s ease-in-out infinite;
  }

  @keyframes scrl {
    0%   { transform: scaleY(0); transform-origin: top; }
    50%  { transform: scaleY(1); transform-origin: top; }
    51%  { transform: scaleY(1); transform-origin: bottom; }
    100% { transform: scaleY(0); transform-origin: bottom; }
  }

  /* Tab switcher */
  .tabs {
    position: fixed;
    top: 1.5rem;
    right: 1.5rem;
    z-index: 99;
    display: flex;
    gap: 0.5rem;
  }

  .tab {
    padding: 0.4rem 1rem;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0,0,0,0.6);
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    border-radius: 2px;
    font-family: inherit;
    transition: all 0.2s;
  }

  .tab.active {
    background: rgba(255,255,255,0.95);
    color: #111;
    border-color: transparent;
  }

  .version { display: none; }
  .version.active { display: block; }

  /* ── V2: 輕版文字（左側，小字） ── */
  #v2 .name-block, #v3 .name-block {
    left: 3.5rem;
    bottom: 3.5rem;   /* 左下角 — 配合臉在右側的構圖 */
  }

  #v2 .name {
    display: block;
    font-size: clamp(0.65rem, 0.9vw, 0.8rem);
    font-weight: 300;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.65);
    font-style: normal;
    line-height: 1;
  }

  #v2 .role {
    display: block;
    font-size: clamp(0.52rem, 0.7vw, 0.62rem);
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    margin-top: 0.4rem;
    font-style: normal;
  }

  /* ── V3: 重版文字（左側，較大） ── */
  #v3 .name {
    display: block;
    font-size: clamp(1rem, 1.8vw, 1.5rem);
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.82);
    font-style: normal;
    line-height: 1;
  }

  #v3 .role {
    display: block;
    font-size: clamp(0.55rem, 0.75vw, 0.68rem);
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.38);
    margin-top: 0.55rem;
    font-style: normal;
  }
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" onclick="show('v1', this)">現狀</button>
  <button class="tab"        onclick="show('v2', this)">A 輕版</button>
  <button class="tab"        onclick="show('v3', this)">A 重版</button>
</div>

<!-- V1: 只有簽名 -->
<div id="v1" class="version active">
  <div class="hero">
    <img class="photo" src="images/02.png" alt="">
    <img class="sig" src="images/signtrue-rowan.png" alt="林星妍">
    <div class="scroll-ind"><div class="scroll-bar"></div><span>Scroll</span></div>
  </div>
</div>

<!-- V2: 輕版 — 簽名 + 小字左下 -->
<div id="v2" class="version">
  <div class="hero">
    <img class="photo" src="images/02.png" alt="">
    <div class="text-overlay name-block">
      <span class="name">Rowan Lin</span>
      <span class="role">UI/UX Designer</span>
    </div>
    <img class="sig" src="images/signtrue-rowan.png" alt="林星妍">
    <div class="scroll-ind"><div class="scroll-bar"></div><span>Scroll</span></div>
  </div>
</div>

<!-- V3: 重版 — 簽名 + 大字左下 -->
<div id="v3" class="version">
  <div class="hero">
    <img class="photo" src="images/02.png" alt="">
    <div class="text-overlay name-block">
      <span class="name">Rowan Lin</span>
      <span class="role">UI/UX Designer</span>
    </div>
    <img class="sig" src="images/signtrue-rowan.png" alt="林星妍">
    <div class="scroll-ind"><div class="scroll-bar"></div><span>Scroll</span></div>
  </div>
</div>

<script>
  function show(id, btn) {
    document.querySelectorAll('.version').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }
</script>
</body>
</html>
